############################################################
# Application
############################################################

spring.application.name=referee-scheduler
server.port=${PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

############################################################
# PostgreSQL datasource
############################################################

spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

############################################################
# Connection Pool - HikariCP
############################################################

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}

############################################################
# JPA/Hibernate
############################################################

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

############################################################
# Logging
############################################################

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.refscheduler=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:DEBUG}

############################################################
# JWT
############################################################

app.jwt.secret=${APP_JWT_SECRET:change-me-change-me-change-me-change-me}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.refresh-token.expiration-days=${APP_REFRESH_TOKEN_EXPIRATION_DAYS:7}
